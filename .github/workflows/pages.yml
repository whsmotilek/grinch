name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        # /5/ — текущая сборка из src (холодный свет; тёплая --light=warm отсеяна 29.10, файлы целы). /1–/4 — замороженные из versions/.
        # Каждая версия — своя папка со своими assets/ (относительные пути), версии друг друга не задевают.
        run: |
          mkdir -p _site && cp -R versions/. _site/
          python3 build.py --light=cold --out=_site/5
          mv _site/5/grinchin.html _site/5/index.html
          cp root-index.html _site/index.html
          cp root-404.html _site/404.html   # битые адреса → «Тупик.» на /5/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
