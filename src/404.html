<!-- V3 · 404 (v4). «Тупик.» на диораме-тупике (404-bg: стена, барьер с лаймовым крестом, забор) + маскот 404

     (img loading=lazy внутри скрытого оверлея). При data-mascot="none"/"quiet" — просто сцена.
     Открывает K1/V1: GV.open('404') / ?open=404 / битый #hash. -->
<div id="page-404" class="ov ov--full" role="dialog" aria-modal="true" aria-labelledby="p404-title" hidden>
  <div class="ov-panel e404">
    <div class="e404-art" aria-hidden="true">
      <picture class="e404-bg"><source media="(max-aspect-ratio: 4/5)" type="image/avif" srcset="{{asset:img/v4/scenes/404-bg-m-720.avif}} 720w, {{asset:img/v4/scenes/404-bg-m-1080.avif}} 1080w" sizes="100vw"><source media="(max-aspect-ratio: 4/5)" type="image/webp" srcset="{{asset:img/v4/scenes/404-bg-m-720.webp}} 720w, {{asset:img/v4/scenes/404-bg-m-1080.webp}} 1080w" sizes="100vw"><source type="image/avif" srcset="{{asset:img/v4/scenes/404-bg-1440.avif}} 1440w, {{asset:img/v4/scenes/404-bg-2560.avif}} 2560w" sizes="100vw"><img src="{{asset:img/v4/scenes/404-bg-1440.webp}}" srcset="{{asset:img/v4/scenes/404-bg-1440.webp}} 1440w, {{asset:img/v4/scenes/404-bg-2560.webp}} 2560w" sizes="100vw" alt="" width="2560" height="1440" loading="lazy" decoding="async"></picture>

    <button class="e404-logo" type="button" data-close data-home aria-label="GRINCHIN — на главную"><!--@svg:logo--></button>
    <div class="e404-in">
      <div class="e404-txt">
        <p class="e404-code">404 · маршрута нет</p>

      <button class="btn btn--accent e404-home" type="button" data-close data-home>На&nbsp;главную <svg class="gl" viewBox="0 0 16 12" aria-hidden="true"><path d="M0 6h14.5M9.5 1l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
    </div>
