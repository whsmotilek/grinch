<!-- K4 · О БРЕНДЕ v3. Дверь со скотчем (v1, любимый кадр) + сцена #brand-stage по оси data-brand:
     sign  — 3D-знак ONE WAY or ANOTHER (рисует K2 в .bs-sign — sticky 100svh внутри высокого #brand-stage);
     story — починенная история STOP → ST’ART v1, собирается в НОВЫЙ логотип (рисует motion.js в .bs-story). -->
<section id="about" class="ab" aria-labelledby="about-title">
  <!-- Дверь (T2 v3.1). Desktop/планшет — кадр как был. Телефон (портрет) — .ab-door выше экрана на --door-run,
       .ab-door-frame липнет под шапкой, door.js ведёт «камеру» .ab-door-cam по прокрутке: вдоль слова G→N,
       потом отъезд до двери целиком. reduced-motion / ?shot=1 / без JS — статичный полный кадр.
       На телефоне-портрете грузится door-cam.* — тот же кадр с запечённой растушёвкой верха/низа в #050505. -->
  <div class="ab-door" data-door>
    <div class="ab-door-frame">
      <div class="ab-door-cam">
        <picture><source media="(max-width: 767px) and (orientation: portrait)" type="image/avif" srcset="{{asset:img/street/door-cam.avif}}"><source media="(max-width: 767px) and (orientation: portrait)" type="image/jpeg" srcset="{{asset:img/street/door-cam.jpg}}"><source type="image/avif" srcset="{{asset:img/street/door.avif}}"><img class="ab-door-img" src="{{asset:img/street/door.jpg}}" alt="GRINCHIN, выклеенный зелёным скотчем на железной двери с граффити" width="1448" height="1086" loading="lazy" decoding="async"></picture>
      </div>
      <div class="ab-door-cap">
        <h2 id="about-title" class="ab-title" lang="en">One way<br>or another.</h2>
      </div>
    </div>
  </div>
  <div id="brand-stage" class="bs">
    <div class="bs-sign" data-g-dock="sign"></div>
    <div class="bs-story" data-story>
      <div class="bs-frame">
        <div class="bs-street" aria-hidden="true"></div>
        <svg class="bs-svg" aria-hidden="true" focusable="false"></svg>
        <ol class="bs-caps">
          <li>Знаки решают за&nbsp;тебя.</li>
          <li>Стоп — это тоже старт.</li>
          <li lang="en">Ignore the signs.</li>
        </ol>
      </div>
    </div>
  </div>
</section>
