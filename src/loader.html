L.started=true;try{localStorage.setItem('gv-seen',String(Date.now()));}catch(e){}
var short=mode==='short',S=JSON.parse(D.getElementById('gv-shapes').textContent);
var q=function(s){return ld.querySelector(s);},mk=q('.ld-mark'),cover=q('.ld-cover'),grain=q('.ld-grain'),smile=q('.ld-smile'),line=q('.ld-line'),
  lt=q('.ld-letters'),dot=q('.ld-dot'),cap=q('.ld-cap'),mz=q('.ld-mascot'),horns=[].slice.call(ld.querySelectorAll('.ld-horn'));
horns[0].setAttribute('d',S.hornL);horns[1].setAttribute('d',S.hornR);
var NUM=/-?\d*\.?\d+(?:e[-+]?\d+)?/gi;
function pl(a,b){var na=a.match(NUM).map(Number),nb=b.match(NUM).map(Number),pr=b.split(NUM);return function(t){var s=pr[0];for(var i=0;i<na.length;i++)s+=(+(na[i]+(nb[i]-na[i])*t).toFixed(1))+' '+pr[i+1];return s;};}
var toBody=pl(S.flat,S.body),toSmile=pl(S.body,S.smile);
line.setAttribute('d',short?S.smile:S.flat);
function rgb(c){c=String(c).trim();if(c[0]==='#'){var x=c.slice(1);if(x.length===3)x=x.replace(/./g,'$&$&');return[0,2,4].map(function(i){return parseInt(x.substr(i,2),16);});}var m=c.match(/\d+(\.\d+)?/g);return m?m.slice(0,3).map(Number):[0,0,0];}
function mix(a,b,t,al){return 'rgba('+a.map(function(v,i){return Math.round(v+(b[i]-v)*t);}).join(',')+','+(al==null?1:al)+')';}
/* один зелёный на экран: если из-за края выглядывает маскот (лаймовый), знак и буквы рисуются белым — лайм у маскота и его рулона */
var MZ=!short&&!!mz&&getComputedStyle(mz).display!=='none';if(MZ)ld.setAttribute('data-mz','1');
var GR=MZ?[242,242,236]:rgb(getComputedStyle(h).getPropertyValue('--c-green')||'#8ED308'),WH=[255,255,255];
var E={p1io:function(t){return t<.5?2*t*t:1-2*(1-t)*(1-t);},p2io:function(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;},
  p3io:function(t){return t<.5?8*t*t*t*t:1-Math.pow(-2*t+2,4)/2;},p2o:function(t){return 1-Math.pow(1-t,3);},p2i:function(t){return t*t*t;},
  si:function(t){return 1-Math.cos(t*Math.PI/2);},so:function(t){return Math.sin(t*Math.PI/2);},sio:function(t){return -(Math.cos(Math.PI*t)-1)/2;},lin:function(t){return t;}};
var T=[],C=[];function tr(at,du,e,fn){T.push({at:at,du:du,e:e,fn:fn,d:0});}function call(at,fn){C.push({at:at,fn:fn,d:0});}
/* тайминг: полный ≈ 2,3 с (ready ≈ 2,0 с), повтор ≈ 0,75 с */
var t0=.18,tM=.58,tH=.95,tB=1.36,tL=short?.04:1.2,tF=short?.3:1.8,fd=short?.42:.5;
/* куда садится знак: контент-бокс svg лого в шапке (viewBox вписан с xMidYMid) — посадка пиксель в пиксель */
var flip=null;function target(){if(flip)return flip;var a=mk.getBoundingClientRect(),l=D.querySelector('#logo svg'),b=l&&l.getBoundingClientRect(),ok=b&&b.width>4&&b.height>2;
  var x=0,y=0,s=.2,c=GR;
  if(ok){var A=1660/458,cw=b.width,ch=b.height;if(cw/ch>A)cw=ch*A;else ch=cw/A;x=b.left+(b.width-cw)/2-a.left;y=b.top+(b.height-ch)/2-a.top;s=cw/a.width;c=rgb(getComputedStyle(l).color);}
  else{x=0;y=-a.top-a.height;}
  var bx=a.left+a.width*S.beak[0]/1660,by=a.top+a.height*S.beak[1]/458,vw=innerWidth,vh=innerHeight,R=0;
  [[0,0],[vw,0],[0,vh],[vw,vh]].forEach(function(p){R=Math.max(R,Math.hypot(p[0]-bx,(p[1]-by)/.8));});
  flip={x:x,y:y,s:s,c:c,ok:ok,bx:bx,by:by,R:R*1.04,vw:vw,vh:vh};return flip;}
var CLIP=!!(W.CSS&&CSS.supports&&CSS.supports('clip-path','path(evenodd,"M0 0H1V1H0Z")'));
function hole(p){var f=target();if(!CLIP){cover.style.transform='translateY('+(100*p).toFixed(2)+'%)';return;}
  var rx=Math.max(.01,f.R*p),ry=rx*.8,x=f.bx-rx,y=f.by;
  cover.style.clipPath='path(evenodd,"M0 0H'+f.vw+'V'+f.vh+'H0Z M'+x.toFixed(1)+' '+y.toFixed(1)+'a'+rx.toFixed(1)+' '+ry.toFixed(1)+' 0 1 0 '+(2*rx).toFixed(1)+' 0a'+rx.toFixed(1)+' '+ry.toFixed(1)+' 0 1 0 '+(-2*rx).toFixed(1)+' 0Z")';}
if(!short){
  tr(.3,.5,E.so,function(p){cap.style.opacity=(.85*p).toFixed(3);});
  tr(t0,.25,E.si,function(p){dot.style.animation='none';dot.style.opacity=1-p;dot.style.transform='scale('+(1-.5*p)+')';});
  tr(t0,.5,E.p3io,function(p){line.style.opacity=1;line.style.transform='scaleX('+(.005+.995*p)+')';});
  tr(tM,.42,E.p2io,function(p){line.setAttribute('d',toBody(p));});
  tr(tM,.45,E.sio,function(p){line.style.fill=mix(GR,GR,0,p);line.style.stroke=mix(WH,GR,p);});
  tr(tH,.38,E.p2o,function(p){line.setAttribute('d',toSmile(p));});
  tr(tH,.32,E.p1io,function(p){horns.forEach(function(e){e.style.opacity=1;e.style.strokeDashoffset=1-p;});});
  tr(tH+.32,.25,E.so,function(p){horns.forEach(function(e){e.style.opacity=1-p;});});
  /* маскот: выглядывает из-за левого края (0,32 → 0,9 с, с перелётом), трясёт рулоном на «вдохе», прячется перед раскрытием */
  if(MZ){var mzX=-104,mzR=0,mzS=function(){mz.style.transform='translateX('+mzX.toFixed(2)+'%) rotate('+mzR.toFixed(2)+'deg)';};
    var back=function(t){var c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
    tr(.32,.58,function(t){return t;},function(p){mzX=-104+104*back(p);mzS();});
    tr(1.18,.62,E.lin,function(p){mzR=p<1?-3.2*Math.sin(p*Math.PI*3)*(1-p):0;mzS();});
    tr(tF-.12,.34,E.p2i,function(p){mzX=-106*p;mzS();});}
  /* «вдох» v1: готовая улыбка чуть приподнимается от клюва и опускается */
  tr(tB,.4,E.lin,function(p){smile.style.transform=p<1?'scale('+(1+.022*Math.sin(Math.PI*p)).toFixed(4)+')':'';});
}else{
  line.style.fill=mix(GR,GR,1);line.style.stroke=mix(GR,GR,1);
  tr(0,.16,E.so,function(p){line.style.opacity=p;});
}
/* буквы: маска слева направо + посадка на 3 px. Никаких лент поверх знака */
tr(tL,short?.26:.5,E.p2io,function(p){lt.style.clipPath='inset(-20% '+(100-100*p).toFixed(2)+'% -20% 0%)';lt.style.transform=short?'':'translateY('+(3*(1-p)).toFixed(2)+'px)';});
/* ворота перед раскрытием: картинка hero и шрифты, не дольше 0,5 с */
var paused=false,skipping=false;
call(tF-.02,function(){if(skipping)return;var w=[];
  [D.querySelector('#hero-media img'),D.querySelector('#hero .hm-still')].forEach(function(img){
  if(img&&!img.complete)w.push(new Promise(function(r){img.addEventListener('load',r,{once:true});img.addEventListener('error',r,{once:true});}));});
  if(D.fonts&&D.fonts.status!=='loaded')w.push(D.fonts.ready);
  if(!w.length)return;paused=true;var go=function(){paused=false;last=0;};
  Promise.race([Promise.all(w),new Promise(function(r){setTimeout(r,500);})]).then(go,go);});
tr(tF-.25,.22,E.so,function(p){grain.style.opacity=(.055*(1-p)).toFixed(4);if(!short)cap.style.opacity=(.85*(1-p)).toFixed(3);});
/* посадка: знак — в лого шапки (FLIP), цвет — в цвет лого; сайт раскрывается эллипсом из клюва */
tr(tF,fd,E.p3io,function(p){var f=target();mk.style.transform='translate('+(f.x*p).toFixed(2)+'px,'+(f.y*p).toFixed(2)+'px) scale('+(1+(f.s-1)*p).toFixed(5)+')';
  var c=mix(GR,f.c,p);lt.style.color=c;line.style.fill=c;line.style.stroke=mix(GR,f.c,p,1-p);});
call(tF+.02,function(){h.setAttribute('data-hero-in','1');fire('grinchin:loader-progress',{t:+(tF/END).toFixed(3),phase:'reveal'});});
tr(tF+.04,fd+.02,E.p2i,hole);
/* ready — когда раскрыт центр кадра: K2 рождает знак синхронно */
call(tF+(short?.12:.2),sendReady);
/* лого в шапке проявляется ровно в кадр посадки — подмена незаметна */
call(tF+fd,function(){var l=D.getElementById('logo');if(l)l.style.visibility='visible';});
var END=0;T.forEach(function(k){END=Math.max(END,k.at+k.du);});C.forEach(function(k){END=Math.max(END,k.at);});L.duration=END;
function ph(t){return t<tM?'line':t<tL?'smile':t<tF?'word':'reveal';}
function apply(t,force){for(var i=0;i<T.length;i++){var k=T[i];if(t<k.at||(k.d&&!force))continue;var p=Math.min(1,(t-k.at)/k.du);k.fn(k.e(p));if(p>=1)k.d=1;}
  for(i=0;i<C.length;i++){k=C[i];if(t>=k.at&&!k.d){k.d=1;if(!(force&&i===0))k.fn();}}}
var time=0,last=0,rate=1,held=false,ended=false;
function finish(){if(ended)return;ended=true;['pointerdown','keydown','wheel','touchmove'].forEach(function(n){W.removeEventListener(n,skip,true);});
  var l=D.getElementById('logo');if(l)l.style.visibility='';ld.style.display='none';h.setAttribute('data-hero-in','1');h.setAttribute('data-loader','done');
  L.done=true;fire('grinchin:loader-progress',{t:1,phase:'done'});sendReady();}
function tick(now){if(ended||held)return;
  if(!paused){if(last){var dt=Math.min(now-last,100)/1000;time=Math.min(END,time+dt*rate);}last=now;apply(time);
    fire('grinchin:loader-progress',{t:+(time/END).toFixed(3),phase:ph(time)});if(time>=END){finish();return;}}
  else last=0;
  requestAnimationFrame(tick);}
/* пропуск: клик / клавиша / колесо / свайп — доигрывает остаток за 0,35 с */
function skip(e){if(ended||skipping)return;if(e&&e.type==='keydown'&&/^(Tab|Shift|Control|Alt|Meta)$/.test(e.key))return;
  skipping=true;paused=false;rate=Math.max(1,(END-time)/.35);}
['pointerdown','keydown','wheel','touchmove'].forEach(function(n){W.addEventListener(n,skip,{capture:true,passive:true});});
L.timer=setTimeout(function(){if(!ended)skip();},6000);
fire('grinchin:loader-progress',{t:0,phase:'start'});
requestAnimationFrame(tick);
/* для покадровой проверки: остановить и поставить таймлайн в момент t (с) */
L.seek=function(t){held=true;time=t;flip=null;
  dot.style.animation='none';dot.style.opacity=1;dot.style.transform='';line.style.cssText='';line.setAttribute('d',short?S.smile:S.flat);smile.style.transform='';
  horns.forEach(function(e){e.style.cssText='';});lt.style.cssText='';mk.style.transform='';cover.style.cssText='';grain.style.opacity='';cap.style.opacity='';ld.style.display='';if(mz)mz.style.transform='';
  if(short){line.style.fill=mix(GR,GR,1);line.style.stroke=mix(GR,GR,1);}
  if(t<tF)h.removeAttribute('data-hero-in');
  T.forEach(function(k){k.d=0;});C.forEach(function(k){k.d=0;});apply(t,true);if(t>=END)finish();};
})();
</script>
