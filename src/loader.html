<!-- K4 · прелоадер «точка → линия → улыбка → рожки → GRINCHIN → лого в шапку».
     Первый кадр (точка) рисуется до JS: разметка и стили ниже инлайн, без внешних картинок, фильтров и шрифтов.
     Режим решается до первой отрисовки: ?shot=1 и reduced-motion → без прелоадера; повторный визит в сессии → короткий. -->
<script>
(function(){var h=document.documentElement,m='full';
try{if(h.dataset.shot==='1'||/[?&]shot=1/.test(location.search)||matchMedia('(prefers-reduced-motion: reduce)').matches)m='off';
else if(sessionStorage.getItem('gv-seen')==='1')m='short';}catch(e){}
h.setAttribute('data-loader',m);
/* предохранитель: если моушн-слой не стартовал (не загрузился GSAP, ошибка) — не держим сайт под крышкой */
if(m!=='off')document.addEventListener('DOMContentLoaded',function(){setTimeout(function(){
  var g=window.GV;if(g&&g.motion&&g.motion.loaderStarted)return;
  if(/full|short/.test(h.getAttribute('data-loader'))){h.setAttribute('data-loader','done');document.dispatchEvent(new CustomEvent('grinchin:ready'));}
},2500);});})();
</script>
<style>
html[data-loader="full"],html[data-loader="short"]{overflow:hidden}
html[data-loader="full"] #logo,html[data-loader="short"] #logo{visibility:hidden}
html[data-loader="off"] #loader,html[data-loader="done"] #loader{display:none}
#loader{position:fixed;inset:0;z-index:var(--z-loader,100);display:grid;place-items:center;pointer-events:none}
/* крышка с мягким краем сверху: при раскрытии уезжает вниз (transform), сайт проявляется сверху — шапка и голова первыми */
.ld-cover{position:absolute;left:0;right:0;top:-40vh;bottom:0;background:linear-gradient(to bottom,rgba(0,0,0,0),var(--c-black,#000) 40vh)}
.ld-mark{position:relative;width:min(78vw,860px);aspect-ratio:1854/390;transform-origin:0 0}
.ld-mark>svg,.ld-letters,.ld-letters svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.ld-line{fill:transparent;stroke:var(--c-white,#fff);stroke-width:3px;vector-effect:non-scaling-stroke;stroke-linejoin:round;opacity:0}
.ld-horn{fill:none;stroke:var(--c-green,#00DB24);stroke-width:2.5px;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:0}
.ld-letters{color:var(--c-green,#00DB24);clip-path:inset(-20% 100% -20% 0)}
.ld-dot{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--c-green,#00DB24);
  animation:ld-pop .45s cubic-bezier(.16,1,.3,1) both}
html[data-loader="short"] .ld-dot{display:none}
@keyframes ld-pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@media (max-width:767px){.ld-mark{width:86vw}}
</style>
