<!-- H5 · заставки v5. Их ДВЕ (решение Матвея 28.10), общий движок GV.loader.run(kind):
     home  — главная без deep-link: «точка → линия → тело → улыбка с рожками → вдох → GRiNCHiN», затем улыбка логотипа ПРЕВРАЩАЕТСЯ
             в улыбку маскота: контур морфится по точкам и одновременно едет/масштабируется ровно в рот на кадре hero (контур снят
             с самого кадра — hero5-data.json; координаты на экране даёт GV.hero5.mouth по рамке <img>), буквы садятся в лого шапки.
             Вокруг улыбки сцена выходит из темноты: прорезь-эллипс растёт от рта (рот → глаза → капюшон/рожки → фонарь/дверь),
             затемнение гаснет, «камера» отъезжает от рта (зум вокруг центра рта — рот на месте). Линия темнеет в цвет нарисованного
             рта и растворяется в нём. ≈ 4,35 с (B1 29.10; до ворот кадра — ждёт «дыша»). Страница ВСЕГДА открывается с самого верха (scrollRestoration=manual + scrollTo(0,0)
             до показа, при перезагрузке и возврате из bfcache).
     quick — повторный заход на главную в той же сессии (sessionStorage): тот же морф в рот, но знак уже стоит — ≈ 1,6 с; наверх — тоже.
     page  — вход с deep-link (?open=…, ?lk=…, ?login=…, любой #якорь кроме #hero/#top/#main — разделы, #404, битый адрес через 404.html)
             и любая будущая отдельная страница (<html data-gv-page>): только «вдох» знака ≈ 0,85 с, знак — в шапку, крышка гаснет;
             прокрутку НЕ трогаем (якорь/шит открывает shop.js).
     fade  — prefers-reduced-motion (и ?loader=fade): статичный знак и короткий кроссфейд ≈ 0,6 с.
     off   — ?shot=1, &skip=1. Принудительно: ?loader=full|quick|page|fade.
     Нет GV.hero5 / рот вне экрана — запасной путь v4: знак целиком в шапку, эллипс из клюва.
     Движок свой (rAF-таймлайн, без GSAP). Пропуск: клик/клавиша/колесо/свайп — остаток за 0,35 с.
     API: GV.loader {mode, kind, started, ready, done, duration, run(kind), seek(t)}. События: grinchin:loader-progress {t, phase}, grinchin:ready.
     Новая отдельная страница: подключить loader.html (маркер @html) и поставить <html data-gv-page> — режим page сам. -->
<script>
(function(){var h=document.documentElement,L=location,q=L.search,m='full',ss=null;
try{ss=sessionStorage}catch(e){}
var deep=/[?&](open|lk|login)=/.test(q)||h.hasAttribute('data-gv-page')||(L.hash&&!/^#(hero|top|main)?$/.test(L.hash));
var f=(q.match(/[?&]loader=(full|quick|page|fade|off|short)/)||[])[1];
try{if(h.dataset.shot==='1'||/[?&]shot=1/.test(q)||/[?&]skip=1/.test(q))m='off';
else if(f)m=f==='short'?'fade':f;
else if(deep)m='page';
else if(ss&&ss.getItem('gv-home'))m='quick';
if(!f&&m!=='off'&&matchMedia('(prefers-reduced-motion: reduce)').matches)m='fade';}catch(e){}
h.setAttribute('data-loader',m);
/* главная (не deep-link): всегда с самого верха — и при перезагрузке, и при возврате «назад» (bfcache) */
if(!deep){try{if('scrollRestoration' in history)history.scrollRestoration='manual';}catch(e){}
  var top=function(){try{window.scrollTo(0,0);}catch(e){}};top();
  window.addEventListener('pageshow',function(e){if(e.persisted)top();});
  document.addEventListener('DOMContentLoaded',top,{once:true});}
h.setAttribute('data-ld-kind',deep?'page':'home');})();
</script>
<style>
/* полоса прокрутки: место под неё держим и под крышкой — иначе после заставки кадр hero сдвинется на ширину полосы */
html:is([data-loader="full"],[data-loader="quick"],[data-loader="page"],[data-loader="fade"]){overflow:hidden;scrollbar-gutter:stable}
html:is([data-loader="full"],[data-loader="quick"],[data-loader="page"],[data-loader="fade"]) #logo{visibility:hidden}
html[data-loader="off"] #loader,html[data-loader="done"] #loader{display:none}
/* интерфейс шапки (кабинет, корзина, меню) и бирка режимов проявляются последними — после того как в hero устоялся свет */
html:is([data-loader="full"],[data-loader="quick"]):not([data-hero-in]) :is(#header .hd-right,.mtag){opacity:0}
html:is([data-loader="full"],[data-loader="quick"]) :is(#header .hd-right,.mtag){transition:opacity .5s .1s}
#loader{position:fixed;inset:0;z-index:var(--z-loader,100);display:grid;place-items:center;pointer-events:none;contain:strict}
/* крышка: сплошная заливка; при раскрытии в ней прорезается эллипс от рта маскота (clip-path: path evenodd) */
.ld-cover{position:absolute;inset:0;background:#0b0b0b}
.ld-grain{position:absolute;inset:0;background:url("{{img:img/loader/grain.webp}}") 0 0/160px 160px;opacity:.055}
.ld-pos{position:relative;width:min(74vw,800px);transform:translateY(-35.6%)}
.ld-mark{position:relative;width:100%;aspect-ratio:1660/458;transform-origin:0 0}
.ld-mark>svg,.ld-letters,.ld-letters svg{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
.ld-smile{transform-origin:50% 98.6%}
.ld-line{fill:transparent;stroke:#fff;stroke-width:2.5px;vector-effect:non-scaling-stroke;stroke-linejoin:round;opacity:0;transform-box:fill-box;transform-origin:50% 50%}
.ld-horn{fill:none;stroke:var(--c-green,#8ED308);stroke-width:2px;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:0}
.ld-letters{color:var(--c-green,#8ED308);clip-path:inset(-20% 100% -20% 0)}
/* точка — на средней линии будущей улыбки (х 50 %, у 85,6 % знака); видна до JS */
.ld-dot{position:absolute;left:50%;top:85.6%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--c-green,#8ED308);
  animation:ld-pop .45s cubic-bezier(.16,1,.3,1) both}
@keyframes ld-pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
/* морф: свой слой в координатах экрана, над крышкой (улыбка видна поверх темноты, пока вокруг проявляется сцена) */
.ld-morph{position:absolute;inset:0;width:100%;height:100%;overflow:visible;display:block;visibility:hidden}
.ld-mp{stroke-linejoin:round}
.ld-cap{position:absolute;left:0;right:0;bottom:max(28px,7vh);margin:0;text-align:center;opacity:0;
  font:500 13px/1 var(--font-mono,ui-monospace,monospace);letter-spacing:.18em;text-transform:uppercase;color:#d6d6d0}
@media (max-width:767px){.ld-pos{width:84vw}}
/* fade: знак сразу целиком, без точки; потом короткий кроссфейд всей заставки */
html:is([data-loader="fade"],[data-loader="quick"],[data-loader="page"]) .ld-dot{display:none}
html:is([data-loader="fade"],[data-loader="quick"],[data-loader="page"]) .ld-letters{clip-path:none}
html:is([data-loader="quick"],[data-loader="page"]) .ld-cap{display:none}
</style>

function gate(at,hero){GATE=function(){if(skipping)return;var w=[];

    if(D.fonts&&D.fonts.status!=='loaded')w.push(Promise.race([D.fonts.ready,new Promise(function(r){setTimeout(r,800);})]));   // шрифты нужны интерфейсу (он в конце), свет их не ждёт дольше 0,8 с
    if(!w.length)return;paused=true;gateOk=false;bt0=0;clearTimeout(L.timer);
    var go=function(){gateOk=true;},cap0=function(){heroOK=false;go();};
    Promise.race([Promise.all(w),new Promise(function(r){setTimeout(r,hero?12000:1500);}).then(hero?cap0:go)]).then(go,go);};
  call(at,GATE);}
/* дыхание у ворот: s 0→1→0 за период BR. Ворота открылись — «выдох» из текущей точки за 0,32 с (не ждём конца цикла), затем дальше */
var BR=2.2,rel0=0,relS=0;
function resume(wt){smile.style.transform='';cap.style.transition='opacity .3s';cap.style.opacity='0';paused=false;last=0;
  clearTimeout(L.timer);L.timer=setTimeout(function(){if(!ended)skip();},(END-time+2.5)*1000);L.waited=+wt.toFixed(2);
  fire('grinchin:loader-progress',{t:+(time/END).toFixed(3),phase:'gate-open',waited:L.waited});}
function breathe(now){if(!bt0){bt0=now;wt0=now;rel0=0;}var ph=(now-bt0)/1000/BR,s=Math.pow(Math.sin(Math.PI*ph),2),wt=(now-wt0)/1000;
  if(gateOk){if(!rel0){rel0=now;relS=s;}var r=Math.min(1,(now-rel0)/320);s=relS*Math.pow(1-r,2);if(r>=1||relS<.01){resume(wt);return;}}
  smile.style.transform='scale('+(1+.03*s).toFixed(4)+')';
  if(FULL&&wt>1.4)cap.style.opacity=(Math.min(1,(wt-1.4)/.6)*.75).toFixed(3);}
function flyMark(at,du,withLine){tr(at,du,E.p3io,function(p){var f=target();mk.style.transform='translate('+(f.x*p).toFixed(2)+'px,'+(f.y*p).toFixed(2)+'px) scale('+(1+(f.s-1)*p).toFixed(5)+')';
  var c=mix(GR,f.c,p);lt.style.color=c;if(withLine()){line.style.fill=c;line.style.stroke=mix(GR,f.c,p,1-p);}});}
function showLogo(at,fade){call(at,function(){var l=D.getElementById('logo');if(l){l.style.visibility='visible';if(fade&&l.animate)try{l.animate([{opacity:0},{opacity:1}],{duration:260,easing:'ease-out'});}catch(e){}}});}

/* ---------- раскрытие в hero (full и quick): k — масштаб времени после развилки ---------- */
/* ---------- финал (full и quick): улыбка садится на рот → ВКЛЮЧАЕТСЯ СВЕТ ----------
   1) морф: улыбка лого летит в рот и по пути остывает до холодной светлой линии; буквы уплывают в шапку (как было);
   2) села — крышка уходит (под ней та же тьма hero): видна только светлая улыбка и едва-едва блики глаз;
   3) лампа зажигается неуверенно (full: 3 вспышки разной длины, quick: одна) — на каждой сцена проступает в узком холодном
      конусе сверху; затем горит: конус «доливается» сверху вниз с пере-светом и оседает до кадра. Свет ведёт hero5.js
      (GV.hero5.light — тот же код, что «свет гаснет» при прокрутке к #tape);
   4) улыбка-линия гаснет, когда фронт света доходит до рта (под ней нарисованный рот), глаза — когда до глаз;
   5) интерфейс (кнопки шапки, CTA, подпись дропа) — последним, после того как свет устоялся. */
var PALE=[236,242,234];   // цвет лампы версии (hero5.css --lt-pale: холодный белый / янтарь) — читается в reveal: hero5.css разбирается после заставки
function reveal(tf,k,pat){
  gate(tf-.03,true);
  var md=k<1?.44:.6,land=tf+md,IG=pat==='quick'?.62:1.35,ig0=land+(pat==='quick'?.06:.16);
  /* развилка: есть рот на экране — морф + свет (v5); нет — знак целиком в шапку и эллипс из клюва (v4) */
  call(tf,function(){var lp=getComputedStyle(h).getPropertyValue('--lt-pale');if(lp&&lp.trim())PALE=rgb(lp);var M=mouthState();USE=!!M.ok&&heroOK;L.path=USE?'light':(heroOK?'no-mouth':'timeout');
    if(USE){line.style.visibility='hidden';mp.style.fill=mix(GR,GR,0);mp.style.stroke=mix(GR,GR,0);msvg.style.visibility='visible';
      if(GV.hero5){GV.hero5.light(0);GV.hero5.eyes(0);}}});
  flyMark(tf,fd*k,function(){return !USE;});
  tr(tf,md,E.p2io,function(p){if(!USE)return;morphP=p;drawMorph();});
  tr(tf+md*.4,md*.6,E.sio,function(p){if(!USE)return;var c=mix(GR,PALE,p);mp.style.fill=c;mp.style.stroke=c;});
  call(land,function(){if(USE)cover.style.opacity='0';fire('grinchin:loader-progress',{t:+(land/END).toFixed(3),phase:'reveal'});});
  tr(land,.3,E.so,function(p){if(USE&&GV.hero5)GV.hero5.eyes(.2*p);});
  tr(ig0,IG,E.lin,function(p){if(!USE||!GV.hero5)return;var H5=GV.hero5;
    var over=p>.45?(pat==='quick'?.25:.4)*Math.sin(Math.PI*Math.min(1,(p-.45)/.5)):0;   // пере-свет в начале горения, оседает
    var fr=H5.light(p,{pattern:pat,over:over}),st=H5.stickTop(),my=MO.c[1]-st,ey=H5.eyesY();
    if(p>=.45){mp.style.opacity=(1-Math.min(1,Math.max(0,(fr-my+12)/70))).toFixed(3);
      H5.eyes(.2*(1-Math.min(1,Math.max(0,(fr-ey)/60))));}
    else{mp.style.opacity='';H5.eyes(.2);}});
  call(ig0+IG-.1,function(){h.setAttribute('data-hero-in','1');});
  call(land,sendReady);
  /* v4-запасной путь: эллипс из клюва */
  tr(tf+.38*k,.56*k,E.p2io,function(p){if(USE)return;
    var f=target(),a=f.a,bx=a.left+a.width*S.beak[0]/1660,by=a.top+a.height*S.beak[1]/458,R=0;
    [[0,0],[f.vw,0],[0,f.vh],[f.vw,f.vh]].forEach(function(q){R=Math.max(R,Math.hypot(q[0]-bx,(q[1]-by)/.8));});holeAt(bx,by,0,R*1.04,E.p2o(p));});
  call(tf+.38*k+.3,function(){if(!USE)h.setAttribute('data-hero-in','1');});
  /* лого шапки проявляется поверх севших букв (буквы совпадают пиксель в пиксель, «приходит» только улыбка шапки) */
  showLogo(tf+fd*k,true);
}

if(FULL){
  /* B1 29.10: ≈ 4,3 с, каждый шаг читается: точка .0–.5 → линия .24–.8 → тело .66–1.1 → улыбка с рожками 1.06–1.46 →
     буквы 1.22–1.77 → вдох 1.6–2.15 → пауза (знак целиком) → ворота 2.21 → отлёт букв/морф 2.24–2.84 → посадка →
     вспышки лампы 3.0–3.6 → свет стекает 3.6–4.35 → интерфейс 4.25 */
  var t0=.24,tH=1.06,tB=1.6;
  tr(.4,.5,E.so,function(p){cap.style.opacity=p.toFixed(3);});
  tr(t0,.3,E.si,function(p){dot.style.animation='none';dot.style.opacity=1-p;dot.style.transform='scale('+(1-.5*p)+')';});
  tr(t0,.56,E.p3io,function(p){line.style.opacity=1;line.style.transform='scaleX('+(.005+.995*p)+')';});
  tr(tM,.44,E.p2io,function(p){line.setAttribute('d',toBody(p));});
  tr(tM,.48,E.sio,function(p){line.style.fill=mix(GR,GR,0,p);line.style.stroke=mix(WH,GR,p);});
  tr(tH,.4,E.p2o,function(p){line.setAttribute('d',toSmile(p));});
  tr(tH,.36,E.p1io,function(p){horns.forEach(function(e){e.style.opacity=1;e.style.strokeDashoffset=1-p;});});
  tr(tH+.36,.26,E.so,function(p){horns.forEach(function(e){e.style.opacity=1-p;});});
  inhale(tB,.55);
  tr(tL,.55,E.p2io,function(p){lt.style.clipPath='inset(-20% '+(100-100*p).toFixed(2)+'% -20% 0%)';lt.style.transform='translateY('+(3*(1-p)).toFixed(2)+'px)';});
  tr(tF-.3,.26,E.so,function(p){grain.style.opacity=(.055*(1-p)).toFixed(4);cap.style.opacity=(1-p).toFixed(3);});
  reveal(tF,1,'full');
}else if(QUICK){
  /* повторный заход на главную: знак уже стоит, короткий вдох и тот же морф в рот — ≈ 1 с */
  tM=0;tL=0;tF=.5;
  tr(0,.18,E.so,function(p){mk.style.opacity=p.toFixed(3);});
  inhale(.06,.4);
  tr(tF-.2,.18,E.so,function(p){grain.style.opacity=(.055*(1-p)).toFixed(4);});
  reveal(tF,.66,'quick');
}else if(PAGE){
  /* другая «страница» (deep-link): только вдох знака, знак — в шапку, крышка гаснет. Прокрутку не трогаем */
  tM=0;tL=0;tF=.42;
  tr(0,.14,E.so,function(p){mk.style.opacity=p.toFixed(3);});
  inhale(.08,.32);
  gate(tF-.03,false);
  flyMark(tF,.4,function(){return true;});
  call(tF,function(){h.setAttribute('data-hero-in','1');fire('grinchin:loader-progress',{t:+(tF/END).toFixed(3),phase:'reveal'});});
  tr(tF+.04,.36,E.sio,function(p){cover.style.opacity=(1-p).toFixed(3);});
  call(tF+.1,sendReady);
  showLogo(tF+.4,false);
}else{
  /* fade (reduced-motion): знак стоит целиком; короткий кроссфейд всей заставки */
  tM=0;tL=0;tF=.22;
  call(.2,function(){h.setAttribute('data-hero-in','1');var l=D.getElementById('logo');if(l)l.style.visibility='visible';});
  tr(.24,.36,E.sio,function(p){ld.style.opacity=(1-p).toFixed(3);});
  call(.3,sendReady);
}
T.forEach(function(k){END=Math.max(END,k.at+k.du);});C.forEach(function(k){END=Math.max(END,k.at);});L.duration=END;
function ph(t){return t<tM?'line':t<tL?'smile':t<tF?'word':'reveal';}
/* разовые вызовы — раньше твинов того же кадра: развилка в tF должна решить путь до первого шага морфа и перелёта букв */
function apply(t,force){var i,k;for(i=0;i<C.length;i++){k=C[i];if(t>=k.at&&!k.d){k.d=1;if(!(force&&k.fn===GATE))k.fn();}}
  for(i=0;i<T.length;i++){k=T[i];if(t<k.at||(k.d&&!force))continue;var p=Math.min(1,(t-k.at)/k.du);k.fn(k.e(p));if(p>=1)k.d=1;}}
function finish(){if(ended)return;ended=true;['pointerdown','keydown','wheel','touchmove'].forEach(function(n){W.removeEventListener(n,skip,true);});
  W.removeEventListener('resize',onResize);
  var l=D.getElementById('logo');if(l)l.style.visibility='';ld.style.display='none';h.setAttribute('data-hero-in','1');h.setAttribute('data-loader','done');
  if(GV.hero5&&GV.hero5.release)GV.hero5.release();
  L.done=true;fire('grinchin:loader-progress',{t:1,phase:'done'});sendReady();}
function tick(now){if(ended||held)return;
  if(!paused){if(last){var dt=Math.min(now-last,100)/1000;time=Math.min(END,time+dt*rate);}last=now;apply(time);
    fire('grinchin:loader-progress',{t:+(time/END).toFixed(3),phase:ph(time)});if(time>=END){finish();return;}}
  else{last=0;if(!skipping)breathe(now);}
  requestAnimationFrame(tick);}
/* пропуск: клик / клавиша / колесо / свайп — доигрывает остаток за 0,35 с */
function skip(e){if(ended||skipping)return;if(e&&e.type==='keydown'&&/^(Tab|Shift|Control|Alt|Meta)$/.test(e.key))return;
  skipping=true;paused=false;smile.style.transform='';rate=Math.max(1,(END-time)/.35);}
['pointerdown','keydown','wheel','touchmove'].forEach(function(n){W.addEventListener(n,skip,{capture:true,passive:true});});
/* ресайз/поворот посреди заставки: всё пересчитать по новой вёрстке (рот берётся с кадра заново) */
function onResize(){flip=null;var was=MO&&MO.ok;MO=null;if(was&&USE){var z=zoomNow;if(GV.hero5)GV.hero5.zoom(1);zoomNow=1;
  var mt=mk.style.transform;mk.style.transform='';mouthState();mk.style.transform=mt;
  if(!MO.ok){USE=false;msvg.style.visibility='hidden';line.style.visibility='';}else zoom(z);}}
W.addEventListener('resize',onResize);
L.timer=setTimeout(function(){if(!ended)skip();},(END+2.5)*1000);   // страховка; у ворот снимается и ставится заново
fire('grinchin:loader-progress',{t:0,phase:'start'});
requestAnimationFrame(tick);
/* для покадровой проверки: остановить и поставить таймлайн в момент t (с) */
L.seek=function(t){held=true;time=t;flip=null;MO=null;USE=false;morphP=0;
  if(ended){ended=false;h.setAttribute('data-loader',mode);L.done=false;if(GV.hero5&&GV.hero5.hold)GV.hero5.hold();}
  var lg=D.getElementById('logo');if(lg)lg.style.visibility='';
  dot.style.animation='none';dot.style.opacity=1;dot.style.transform='';line.style.cssText='';smile.style.transform='';
  horns.forEach(function(e){e.style.cssText='';});lt.style.cssText='';mk.style.cssText='';cover.style.cssText='';grain.style.opacity='';cap.style.opacity='';
  ld.style.display='';ld.style.opacity='';mp.style.cssText='';msvg.style.visibility='';if(GV.hero5){GV.hero5.zoom(1);GV.hero5.dim(0);}zoomNow=1;
  if(FULL)line.setAttribute('d',S.flat);else solid();
  if(t<tF)h.removeAttribute('data-hero-in');
  T.forEach(function(k){k.d=0;});C.forEach(function(k){k.d=0;});apply(t,true);if(t>=END)finish();};
}
if(mode!=='manual')L.run(mode);
})();
</script>
