<script>
/* Вкладка ушла в фон — знак переворачивается рогами вниз (грустная ухмылка), вернулся — улыбается. */
(function(){
  var ok="{{asset:meta/favicon.svg}}", sad="{{asset:meta/favicon-sad.svg}}", title=document.title;
  document.addEventListener("visibilitychange", function(){
    var l=document.getElementById("fav-svg"); if(!l) return;
    if(document.hidden){ l.href=sad; document.title="Маршрут не задан… — GRINCHIN"; }
    else { l.href=ok; document.title=title; }
  });
})();
</script>
