<section id="next" aria-labelledby="next-title">
  <div class="tx-layer tx-layer--paper" aria-hidden="true"></div>
  <div class="wrap next-row">
    <div class="next-copy">
      <h2 id="next-title" class="next-title">Разобрали — вернём.</h2>
      <p class="next-sub">Дата перезапуска — тем, кто подписан.</p>
    </div>
    <form class="sub-form" data-sub novalidate>
      <fieldset class="seg">
        <legend class="vh">Куда написать</legend>
        <label><input type="radio" name="ch" value="tg" checked><span>Telegram</span></label>
        <label><input type="radio" name="ch" value="email"><span>Email</span></label>
      </fieldset>
      <label class="field">
        <span class="mono-label" data-sub-label>ник в Telegram:</span>
        <input type="text" name="contact" autocomplete="off" placeholder="@твой_ник" data-sub-input aria-describedby="sub-err">
      </label>
      <p class="field-err" id="sub-err" data-sub-err></p>
      <button class="btn btn--accent btn--wide" type="submit">Подписаться</button>
      <div class="sub-done" data-sub-done hidden tabindex="-1">
        <p class="sub-done-big">Есть. Ты в списке.</p>
        <p data-sub-done-text>Напишем в Telegram.</p>
      </div>
    </form>
  </div>
</section>
