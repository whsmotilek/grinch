<!-- K5 · «Разобрали — вернём». Подписка без сети: Telegram / почта, поле-бирка, ошибки aria-live.
     Успех: zip-пакет с печатью GRiNCHiN (вектор, end.js рисует по намерению подписаться) + две ленты K3 (растр: лаймовая
     и чёрная, .tape-strip) «прилепляются» крест-накрест; пока блок hidden, их фон не грузится. Маскот выглядывает из-за пакета: [data-mascot-slot="next"]. -->
<section id="next" aria-labelledby="next-title">
  <div class="wrap nx-grid">
    <div class="nx-copy">
      <h2 id="next-title" class="nx-title">Разобрали&nbsp;— вернём.</h2>
      <p class="nx-sub">Дату перезапуска скажем тем, кто подписан.</p>
    </div>

    <div class="nx-side">
      <form class="nx-form" data-nx-form novalidate>
        <fieldset class="nx-switch">
          <legend class="vh">Куда написать</legend>
          <label><input type="radio" name="nx-ch" value="telegram" checked><span>Telegram</span></label>
          <label><input type="radio" name="nx-ch" value="email"><span>Почта</span></label>
        </fieldset>
        <div class="nx-tag">
          <label class="nx-cell" for="nx-input">
            <span class="nx-k" data-nx-label>ник:</span>
            <input class="nx-input" id="nx-input" name="contact" type="text" placeholder="@ник"
                   autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="text"
                   aria-describedby="nx-err" data-nx-input>
          </label>
          <button class="btn btn--accent nx-submit" type="submit">Подписаться</button>
        </div>
        <p class="nx-err" id="nx-err" data-nx-err aria-live="polite"></p>
      </form>

      <div class="nx-done" data-nx-done hidden>
        <figure class="nx-bag" data-nx-bag aria-label="Прозрачный zip-пакет GRINCHIN, крест-накрест заклеенный лентами — лаймовой и чёрной" role="img">
          <div class="nx-scene" data-nx-scene></div>
          <span class="tape-strip tape-strip--lime nx-x nx-x--l" aria-hidden="true"></span>
          <span class="tape-strip tape-strip--black nx-x nx-x--k" aria-hidden="true"></span>
          <div class="nx-mz" data-mascot-slot="next" data-mascot-pose="head" data-mascot-mood="joy" aria-hidden="true"></div>
        </figure>
        <div class="nx-done-txt" role="status">
          <p class="nx-done-t" tabindex="-1" data-nx-done-title>Есть. Ты в&nbsp;списке.</p>
          <p class="nx-done-s" data-nx-done-text>Напишем в&nbsp;Telegram.</p>
        </div>
      </div>
    </div>
  </div>
</section>
